<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loja Demo | Serviços</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182338;background:#f1f5f9}*{box-sizing:border-box}
body{margin:0}.top{background:#13213b;color:white;padding:28px max(20px,calc((100vw - 1000px)/2))}
.top p{color:#bdc9df}main{max-width:1000px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:white;border-radius:12px;padding:22px;box-shadow:0 8px 24px #172a4510}
h2{font-size:17px;margin:0 0 14px}ul{list-style:none;padding:0;margin:0}li{padding:9px 0;border-bottom:1px solid #e9edf4}li:last-child{border:0}.chip{display:inline-block;background:#d9f4e3;color:#12532d;border-radius:14px;padding:5px 12px;font-size:12px}footer{color:#64748b;margin-top:30px;font-size:13px}button{border:0;background:#2563eb;color:white;border-radius:7px;padding:10px 16px;cursor:pointer}
</style></head><body><header class="top"><h1>Loja Demo</h1><p>Laboratório de migração: monólito → microsserviços</p><span class="chip" id="state">Carregando APIs…</span></header>
<main><p>Dados de demonstração, sem cadastro ou banco de dados. Cada grupo vem de uma API independente atrás do Nginx.</p>
<button onclick="loadAll()">Atualizar dados</button><div class="grid" style="margin-top:20px">
<section class="card"><h2>Catálogo</h2><ul id="products"></ul></section>
<section class="card"><h2>Clientes</h2><ul id="customers"></ul></section>
<section class="card"><h2>Pedidos</h2><ul id="orders"></ul></section></div>
<footer>Docker Compose · Nginx · Ansible · Python</footer></main>
<script>
async function show(endpoint,id,display){const resp=await fetch('/api/'+endpoint);if(!resp.ok)throw new Error(endpoint+' HTTP '+resp.status);const json=await resp.json();document.getElementById(id).replaceChildren(...json.items.map(item=>{const li=document.createElement('li');li.textContent=display(item);return li}));}
async function loadAll(){const state=document.getElementById('state');state.textContent='Consultando APIs…';try{await Promise.all([show('products','products',i=>i.name+' · R$ '+i.price.toFixed(2)),show('customers','customers',i=>i.name),show('orders','orders',i=>'Pedido #'+i.id+' · Produto '+i.product_id+' · Qtd '+i.quantity)]);state.textContent='3 APIs disponíveis';}catch(e){state.textContent='Erro: '+e.message;}}
loadAll();
</script></body></html>
