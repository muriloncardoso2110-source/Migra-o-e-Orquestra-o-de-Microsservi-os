name: loja-migracao
x-api-common: &api-common
  build:
    context: ./services
  restart: unless-stopped
  networks:
    - backend
  read_only: true
  security_opt:
    - no-new-privileges:true

services:
  catalog:
    <<: *api-common
    environment:
      SERVICE: catalog
  customers:
    <<: *api-common
    environment:
      SERVICE: customers
  orders:
    <<: *api-common
    environment:
      SERVICE: orders
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/site:/usr/share/nginx/html:ro
    depends_on:
      catalog:
        condition: service_healthy
      customers:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

  monolith:
    <<: *api-common
    profiles: ["legacy"]
    environment:
      SERVICE: monolith
    ports:
      - "${LEGACY_PORT:-8081}:8000"

networks:
  backend:
    driver: bridge
